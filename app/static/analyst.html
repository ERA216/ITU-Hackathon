<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z' fill='%2300ab75'/%3E%3Cpath d='m8.5 12 2.5 2.5 4.5-5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Чистый счёт: панель аналитика</title>
<style>
  :root { --bg:#fff; --card:#fff; --ink:#1d1d1e; --muted:#587366; --line:#d6eadf;
          --brand:#00ab75; --brand-ink:#00875c; --fill:#e6f3ed; --warn:#c62828; --warn-bg:#fdeeee; --ok:#00875c; --ok-bg:#e6f7f0; --amber:#6b4a00; --amber-bg:#fff5df;
          --blue:#1f3a8a; --blue-bg:#eef2fd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.45 "Roboto Flex", Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; background:#fff; border-bottom:1px solid var(--line); }
  header b { color:var(--ink); font-size:17px; font-weight:700; }
  header a { color:var(--muted); font-size:14px; }
  .wrap { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px; max-width:1180px; margin:0 auto; }
  @media (max-width:760px) { .wrap { grid-template-columns:1fr; } }
  h2 { font-size:16px; font-weight:700; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid #d6eadf; border-radius:16px; padding:16px; margin-bottom:12px; }
  .item { display:block; width:100%; text-align:left; background:#fff; border:1px solid #d6eadf; border-radius:12px;
          padding:12px 14px; margin-bottom:8px; cursor:pointer; font:inherit; color:inherit; }
  .item:hover { border-color:#b9dccb; }
  .item.sel { border-color:var(--brand); box-shadow:0 0 0 1px var(--brand); }
  .item b { display:block; margin-bottom:2px; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; font-size:12px; font-weight:500; padding:2px 8px; border-radius:6px; margin-top:4px; background:var(--fill); color:var(--muted); }
  .pill.unwitting { background:var(--ok-bg); color:var(--ok); }
  .pill.organizer { background:var(--warn-bg); color:var(--warn); }
  .pill.unclear, .pill.wait { background:var(--amber-bg); color:var(--amber); }
  .chain { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .node { background:var(--fill); border-radius:12px; padding:8px 12px; min-width:0; }
  .node b { display:block; overflow-wrap:anywhere; }
  .arrow { text-align:center; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .arrow strong { display:block; color:var(--ink); font-size:14px; }
  ul { margin:6px 0; padding-left:0; list-style:none; }
  li { display:flex; gap:10px; padding:5px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .pts { flex:0 0 38px; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; }
  .plus { color:var(--ok); } .minus { color:var(--warn); }
  blockquote { margin:6px 0; padding:10px 12px; background:var(--fill); border-radius:12px; overflow-wrap:anywhere; }
  textarea { width:100%; min-height:70px; padding:10px 12px; border:1px solid transparent; border-radius:12px; background:var(--fill); font:inherit; color:inherit; resize:vertical; }
  textarea:focus, .login input:focus { outline:none; border-color:var(--brand); background:#fff; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  button.act { border:0; border-radius:12px; padding:12px 16px; font:inherit; font-weight:500; cursor:pointer; flex:1 1 180px; }
  .approve { background:var(--brand); color:#fff; } .approve:hover { background:#009d6b; } .reject { background:var(--warn-bg); color:var(--warn); }
  .note { border-radius:12px; padding:10px 12px; margin-top:10px; background:var(--warn-bg); color:var(--warn); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:760px) { .grid2 { grid-template-columns:1fr; } }
  a { color:var(--brand-ink); }
  .login { max-width:360px; margin:40px auto; }
  .login input { width:100%; padding:12px 14px; border:1px solid transparent; background:var(--fill); border-radius:12px; font:inherit; margin-top:4px; }
  .hbtn { border:1px solid #00ab75; background:#fff; border-radius:20px; padding:6px 12px; font:inherit; font-size:13px; font-weight:500; cursor:pointer; color:#00875c; }
  .hbtn:hover { background:#e6f7f0; }
  [hidden] { display:none !important; }
  .pill.late { background:var(--warn); color:#fff; }
  .tabs { display:flex; gap:6px; background:none; border-radius:20px; padding:0; margin-bottom:10px; }
  .tabs button { flex:1; border:0; background:none; border-radius:16px; padding:6px 4px; font:inherit; font-size:13px; font-weight:500; color:#1d1d1e; cursor:pointer; }
  .tabs button:hover { background:#e6f7f0; }
  .tabs button[aria-selected="true"] { background:#00ab75; color:#fff; }
  .card.linked { border:2px solid var(--warn-bg); }
  .card.decision { border:2px solid var(--brand-bg, #e6f7f0); }
  header a { margin-left:14px; text-decoration:none; }
  ol.hops { list-style:none; padding:0; margin:8px 0 0; }
  ol.hops li { display:grid; grid-template-columns:110px 1fr; column-gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  ol.hops li:first-child { border-top:0; }
  ol.hops li.cur { background:var(--ok-bg); border-radius:10px; padding-left:8px; }
  ol.hops .muted { grid-column:2; }
  .hopn { color:var(--muted); font-size:13px; grid-row:span 2; }
  .linkbtn { border:0; background:none; padding:0; font:inherit; font-weight:500; color:var(--brand-ink); text-decoration:none; cursor:pointer; text-align:left; }
  .timeline { margin:6px 0 0; padding:0; list-style:none; }
  .timeline li { display:grid; grid-template-columns:118px 1fr; gap:10px; }
  .timeline .who { color:var(--muted); font-size:13px; }
  /* Граф денег: счета и переводы вокруг случая. */
  .wrap > div { min-width:0; }   /* иначе широкий граф растягивает колонку и всю страницу */
  .graph { overflow-x:auto; }
  .graph svg { display:block; }
  .graph .gnode[data-gopen] { cursor:pointer; }
  .graph .gnode[data-gopen]:hover rect { stroke-width:2.5; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--muted); margin-top:10px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { display:inline-block; width:24px; border-top:2px solid #587366; }
  .legend i.wait { border-top:2px dashed #b07d00; } .legend i.stop { border-top:2px dashed #9fb3aa; }
  .legend b { display:inline-block; width:14px; height:12px; border-radius:3px; border:1px solid; }
  /* Правило двух ключей и скрытые данные. */
  .emp { font-size:13px; color:var(--muted); margin:0 0 10px; }
  .emp b { color:var(--ink); }
  .twokey { background:var(--amber-bg); color:var(--amber); border-radius:12px; padding:10px 12px; margin-top:10px; }
  .pii { margin-top:6px; font-size:14px; }
  .pii select { font:inherit; font-size:14px; padding:6px 8px; border-radius:10px; border:1px solid var(--line); background:#fff; }
  .pii .act { flex:0 0 auto; padding:7px 12px; }
  /* Общее верхнее меню: четыре страницы проекта, текущая выделена. */
  .topbar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:10px 20px; background:#fff; border-bottom:1px solid #d6eadf; }
  .topbar .brand { font-weight:700; font-size:17px; color:#1d1d1e; text-decoration:none; white-space:nowrap;
                   display:inline-flex; align-items:center; gap:8px; }
  .topbar .brand .logo { width:22px; height:22px; flex:none; }
  .pages { display:flex; gap:6px; background:none; border-radius:20px; padding:0; overflow-x:auto; scrollbar-width:none; }
  .pages::-webkit-scrollbar { display:none; }
  .pages a { padding:7px 14px; border-radius:17px; border:0; background:none; font-size:14px; font-weight:500; color:#1d1d1e; text-decoration:none; white-space:nowrap; margin:0; }
  .pages a:hover { background:#e6f7f0; }
  .pages a[aria-current="page"] { background:#00ab75; color:#fff; }
  .topbar .tools { margin-left:auto; display:flex; gap:8px; }
  @media (max-width:700px) {
    .topbar { padding:10px 12px; gap:8px 10px; }
    .pages { order:3; width:100%; display:grid; grid-template-columns:1fr 1fr; }
    .pages a { text-align:center; padding:7px 8px; border-radius:11px; }
  }
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z" fill="#00ab75"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Чистый счёт</a>
  <nav class="pages" aria-label="Страницы проекта"><a href="/client">Экран клиента</a><a href="/analyst" aria-current="page">Панель аналитика</a><a href="/analyst/stats">Эффективность</a><a href="/quality">Качество движка</a></nav>
  <span class="tools"><button class="hbtn" id="reset" hidden>Сбросить демо</button><button class="hbtn" id="logout" hidden>Выйти</button></span></header>
<form class="card login" id="login" hidden>
  <h2>Вход для сотрудника банка</h2>
  <label for="empSel" class="muted">Сотрудник</label>
  <select id="empSel" style="width:100%;padding:12px 14px;border:1px solid transparent;background:var(--fill);border-radius:12px;font:inherit;margin:4px 0 10px">
    <option value="aruzhan">Аружан С.</option><option value="medet">Медет К.</option></select>
  <label for="pin" class="muted">Код доступа</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
  <button class="act approve" style="margin-top:10px">Войти</button>
  <div id="loginErr"></div>
</form>
<div class="wrap" id="wrap" hidden>
  <div>
    <div class="emp" id="emp"></div>
    <div class="tabs" role="tablist">
      <button data-tab="pending" aria-selected="true">Ждут решения</button><button data-tab="all">Все</button><button data-tab="linked">Связанные счета</button>
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="business">Аренда ИП</button><button data-tab="interbank">Другие банки</button><button data-tab="networks">Сети</button>
    </div>
    <h2 id="queueTitle">Очередь</h2><div id="queue"></div>
  </div>
  <div id="detail"><div class="card muted">Выберите случай слева.</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const money = n => Number(n).toLocaleString('ru-RU') + ' ₸';
const when = s => s.replace('T', ' ').slice(0, 16);
const KIND = {block: 'Блокировка счёта', intercept: 'Перевод на паузе'};
const kind = c => c.kind === 'block' && c.scope === 'partial' ? 'Заморожена спорная сумма' : KIND[c.kind];
const GUARD = {notified: 'узнал(а) об остановке', asked: 'клиент настаивает, ждём подтверждения',
               confirmed: 'подтвердил(а) перевод, решение за сотрудником', cancelled: 'отменил(а) перевод'};
let current = null, currentNet = null, me = {name: '', employees: {}};
const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? few : many;

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) showLogin();
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Ошибка запроса');
  return data;
}
function gap(a, b) {
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  return m < 60 ? `через ${m} мин` : m < 1440 ? `через ${Math.floor(m / 60)} ч ${m % 60} мин` : `через ${Math.floor(m / 1440)} дн`;
}
function days(s) { return Math.floor((Date.now() - new Date(s)) / 86400000); }

let tab = 'pending';
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  loadQueue();
});

async function loadQueue() {
  if (tab === 'linked') return loadLinked();
  if (tab === 'business') return loadBusiness();
  if (tab === 'interbank') return loadInterbank();
  if (tab === 'networks') return loadNetworks();
  const all = await api('/analyst/cases');
  const waiting = all.filter(c => c.needs_decision);
  const q = tab === 'pending' ? waiting : all;
  $('queueTitle').textContent = tab === 'pending' ? `Ждут решения: ${waiting.length}` : `Все случаи: ${all.length}`;
  $('queue').innerHTML = q.map(c => `<button class="item ${c.case_id === current ? 'sel' : ''}" data-id="${c.case_id}">
      <b>${esc(c.client)}</b>
      <span class="muted">${kind(c)} · ${when(c.created_at)}</span><br>
      <span class="pill ${c.role.verdict}">${esc(c.role.label)}</span>
      <span class="pill ${c.needs_decision ? 'wait' : ''}">${esc(c.status_text)}</span>
      ${c.overdue ? '<span class="pill late">Срок ответа прошёл</span>' : ''}
      ${c.from_complaint ? '<span class="pill">По жалобе</span>' : ''}
      ${c.self_reported ? '<span class="pill unwitting">Сообщил сам</span>' : ''}
      ${c.second_key ? '<span class="pill wait">Ждёт второго сотрудника</span>' : ''}
    </button>`).join('') || `<div class="card muted">${tab === 'pending' ? 'Все случаи разобраны.' : 'Случаев нет.'}</div>`;
  $('queue').querySelectorAll('.item').forEach(b => b.onclick = () => open(+b.dataset.id));
}

// Счета, которые всплывают в нескольких независимых случаях: вероятные дропперы и организаторы.
async function loadLinked() {
  const L = await api('/analyst/linked');
  $('queueTitle').textContent = `Связанные счета: ${L.length}`;
  $('queue').innerHTML = (L.length ? '<p class="muted" style="margin:0 0 8px">Одна карта у разных клиентов в разных случаях. Невольные участники друг друга не знают, а «карта для возврата» у мошенника одна на многих.</p>' : '') +
    L.map(a => `<div class="item" style="cursor:default">
      <b>${esc(a.name)}</b>
      <span class="muted">${a.sources} разных клиентов · ${a.cases.length} случаев · ${money(a.amount)} · счёту ${days(a.opened)} дн.</span><br>
      ${a.status === 'blocked' ? '<span class="pill organizer">Счёт приостановлен</span>'
        : `<button class="act reject" style="margin-top:6px;padding:7px 10px" data-suspend="${a.client_id}">Приостановить счёт</button>`}
      <div class="muted" style="margin-top:4px">Случаи: ${a.cases.slice(-4).reverse().map(id => `<button class="linkbtn" data-open="${id}">№${id}</button>`).join(', ')}${a.cases.length > 4 ? ` и ещё ${a.cases.length - 4}` : ''}</div>
    </div>`).join('') || '<div class="card muted">Связанных счетов нет.</div>';
  $('queue').querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(+b.dataset.open));
  $('queue').querySelectorAll('[data-suspend]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const c = await api(`/analyst/accounts/${b.dataset.suspend}/suspend`, {}); await loadLinked(); open(c.case_id); }
    catch (e) { b.disabled = false; alertBox(e.message); }
  });
}
// Счета ИП, похожие на арендованные: много незнакомых плательщиков, деньги сразу уходят частным лицам.
async function loadBusiness() {
  const L = await api('/analyst/business');
  $('queueTitle').textContent = `Аренда ИП: ${L.length}`;
  $('queue').innerHTML = (L.length ? '<p class="muted" style="margin:0 0 8px">Владелец ИП за процент передаёт доступ к счёту, через него проводят деньги обманутых людей. Честный магазин тоже получает деньги от незнакомцев, но платит поставщикам; здесь деньги сразу уходят на карты частных лиц.</p>' : '') +
    L.map(a => `<div class="item" style="cursor:default">
      <b>${esc(a.name)}</b>
      <span class="muted">${esc(a.activity || 'ИП')} · счёту ${days(a.opened)} дн.</span>
      <ul>${a.factors.map(f => `<li><span>${esc(f)}</span></li>`).join('')}</ul>
      ${a.status === 'blocked' ? '<span class="pill organizer">Счёт приостановлен</span>'
        : `<button class="act reject" style="margin-top:6px;padding:7px 10px" data-rent="${a.client_id}">Приостановить счёт</button>`}
    </div>`).join('') || '<div class="card muted">Счетов ИП с признаками аренды нет.</div>';
  $('queue').querySelectorAll('[data-rent]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const c = await api(`/analyst/business/${b.dataset.rent}/suspend`, {}); await loadBusiness(); open(c.case_id); }
    catch (e) { b.disabled = false; alertBox(e.message); }
  });
}
// Запросы между банками через Антифрод-центр. Ответы другого банка в демо имитирует сотрудник.
async function loadInterbank() {
  const d = await api('/analyst/interbank');
  $('queueTitle').textContent = `Другие банки: ${d.requests.length}`;
  const cases = r => r.cases.length ? `<div class="muted" style="margin-top:4px">Случаи: ${r.cases.map(id => `<button class="linkbtn" data-open="${id}">№${id}</button>`).join(', ')}</div>` : '';
  $('queue').innerHTML = '<p class="muted" style="margin:0 0 8px">Если деньги пострадавшего ушли в другой банк, туда через Антифрод-центр уходит запрос на заморозку. Если запрос приходит к нам, система сама идёт по цепочке в нашем банке и сразу отвечает. В демо другой банк — имитация.</p>' +
    d.requests.map(r => `<div class="item" style="cursor:default">
      <b>${r.direction === 'out' ? 'Наш запрос' : 'Запрос к нам'} · ${esc(r.bank)}: ${money(r.amount)}</b>
      <span class="muted">${r.direction === 'out' ? `пострадавший: ${esc(r.victim)} · деньги переслал: ${esc(r.ours)}` : `их клиент перевёл нашему: ${esc(r.ours)}`}</span><br>
      <span class="pill ${r.status === 'sent' ? 'wait' : r.status === 'gone' ? 'organizer' : 'unwitting'}">${esc(r.status_text)}</span>
      ${r.overdue ? '<span class="pill late">Срок ответа прошёл</span>' : ''}
      <div class="muted" style="margin-top:4px">${r.status === 'sent' ? `Отправлен ${when(r.sent_at)}, ответ до ${when(r.due_at)}` : esc(r.note || '')}${r.returned ? ` · вернули пострадавшему ${money(r.returned)}` : ''}</div>
      ${r.status === 'sent' ? `<div class="muted" style="margin-top:6px">Демо: ответ другого банка</div><div class="actions" style="margin-top:4px"><button class="act approve" style="padding:7px 10px" data-ans="${r.id}" data-res="frozen">Заморожено</button>
        <button class="act reject" style="padding:7px 10px" data-ans="${r.id}" data-res="gone">Деньги уже ушли</button></div>` : ''}
      ${r.can_return ? `<button class="act approve" style="margin-top:6px;padding:7px 10px" data-ret="${r.id}">Имитировать возврат пострадавшему</button>` : ''}
      ${cases(r)}
    </div>`).join('') + (d.requests.length ? '' : '<div class="card muted">Запросов пока нет.</div>') +
    (d.incoming_demo.length ? '<h2 style="margin:14px 0 8px">Демо: переводы из других банков</h2>' + d.incoming_demo.map(t => `<div class="item" style="cursor:default">
      <b>${esc(t.sender)} → ${esc(t.receiver)}</b>
      <span class="muted">${money(t.amount)} · ${when(t.created_at)}</span><br>
      <button class="act reject" style="margin-top:6px;padding:7px 10px" data-incoming="${t.id}">Имитировать запрос другого банка</button>
    </div>`).join('') : '');
  $('queue').querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(+b.dataset.open));
  const act = (sel, call) => $('queue').querySelectorAll(sel).forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await call(b); await loadInterbank(); if (r && r.cases && r.cases.length) open(r.cases[0]); }
    catch (e) { b.disabled = false; alertBox(e.message); }
  });
  act('[data-ans]', b => api(`/analyst/interbank/${b.dataset.ans}/answer`, {result: b.dataset.res}));
  act('[data-ret]', b => api(`/analyst/interbank/${b.dataset.ret}/return`, {}));
  act('[data-incoming]', b => api('/analyst/interbank/incoming', {transfer_id: +b.dataset.incoming}));
}

// Граф денег: столбцы слева направо (откуда пришли деньги → куда ушли), стрелка — переводы между двумя счетами.
function drawGraph(host, g, currentCase) {
  const tagged = g.nodes.some(n => n.tag);
  const NW = 176, NH = tagged ? 80 : 64, CW = 290, GY = 22, PAD = 6;
  const cols = {};
  g.nodes.forEach(n => (cols[n.col] = cols[n.col] || []).push(n));
  // Порядок внутри столбца: счёт ставим напротив тех, с кем он связан, — так стрелки меньше пересекаются.
  const order = Object.keys(cols).map(Number).sort((a, b) => a - b), at = {};
  const reindex = () => order.forEach(c => cols[c].forEach((n, i) => { at[n.id] = i - (cols[c].length - 1) / 2; }));
  const near = (n, side) => {
    const v = g.edges.filter(e => e[side === 'to' ? 'from' : 'to'] === n.id).map(e => at[e[side]]).filter(x => x !== undefined);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : at[n.id];
  };
  reindex();
  for (let pass = 0; pass < 2; pass++) {
    for (const c of order.slice(0, -1).reverse()) { cols[c].sort((a, b) => (a.role === 'group') - (b.role === 'group') || near(a, 'to') - near(b, 'to')); reindex(); }
    for (const c of order.slice(1)) { cols[c].sort((a, b) => (a.role === 'group') - (b.role === 'group') || near(a, 'from') - near(b, 'from')); reindex(); }
  }
  const ncol = Math.max(...g.nodes.map(n => n.col)) + 1;
  const rows = Math.max(...Object.values(cols).map(a => a.length));
  const W = (ncol - 1) * CW + NW + 2 * PAD, H = rows * (NH + GY) - GY + 2 * PAD;
  const pos = {};
  for (const [c, arr] of Object.entries(cols)) {
    const top = PAD + (H - 2 * PAD - (arr.length * (NH + GY) - GY)) / 2;
    arr.forEach((n, i) => { pos[n.id] = {x: PAD + c * CW, y: top + i * (NH + GY)}; });
  }
  const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  const LINE = {done: ['#587366', ''], held: ['#b07d00', '6 4'], pending: ['#b07d00', '6 4'], cancelled: ['#9fb3aa', '6 4'], device: ['#c62828', '2 4']};
  const NOTE = {held: 'на паузе', pending: 'уйдёт позже', cancelled: 'отменён'};
  let edges = '';
  const labels = [];
  const fanIn = {}, fanOut = {};
  const moneyEdges = g.edges.filter(e => e.status !== 'device');
  moneyEdges.forEach(e => { fanIn[e.to] = (fanIn[e.to] || 0) + 1; fanOut[e.from] = (fanOut[e.from] || 0) + 1; });
  for (const e of g.edges) {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) continue;
    const [color, dash] = LINE[e.status] || LINE.done;
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x - 2, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
    // Телефон и счёт, в который с него входят: пунктир без стрелки и подписи.
    edges += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${color}" stroke-width="${e.status === 'device' ? 1.5 : 2}"
      ${dash ? `stroke-dasharray="${dash}"` : ''} ${e.status === 'device' ? '' : `marker-end="url(#arr-${e.status in LINE ? e.status : 'done'})"`}/>`;
    if (e.status === 'device') continue;
    // Подпись — там, где стрелки расходятся: у счёта, куда сходится много стрелок, — ближе к отправителю,
    // у счёта, откуда много стрелок выходит, — ближе к получателю. Так подписи не налезают друг на друга.
    const t0 = fanIn[e.to] > 1 && fanOut[e.from] <= 1 ? 0.3 : fanOut[e.from] > 1 && fanIn[e.to] <= 1 ? 0.72 : 0.45;
    const bez = (t, p0, p1, p2, p3) => (1 - t) ** 3 * p0 + 3 * (1 - t) ** 2 * t * p1 + 3 * (1 - t) * t * t * p2 + t ** 3 * p3;
    const lines = [[money(e.amount), 12, 600, '#1d1d1e']];
    const plural = n => n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'перевода' : 'переводов';
    if (e.count > 1) lines.push([`${e.count} ${plural(e.count)}`, 11, 400, '#2f4a3f']);
    if (e.returned) lines.push(['вернули', 11, 400, '#00875c'], [money(e.returned), 11, 400, '#00875c']);
    else if (NOTE[e.status]) lines.push([NOTE[e.status], 11, 400, color]);
    const w = Math.max(...lines.map(l => l[0].length * l[1] * 0.56)) + 12, h = lines.length * 14 + 6;
    // Подпись не заезжает на прямоугольники счетов: держим её в промежутке сразу после отправителя
    // (стрелка может перескакивать через столбец, а между столбцами счетов нет).
    const gapEnd = Math.min(x2, x1 + CW - NW - 2);
    const raw = bez(t0, x1, mx, mx, x2);
    const lx = gapEnd - x1 > w + 12 ? Math.min(Math.max(raw, x1 + w / 2 + 6), gapEnd - w / 2 - 6) : (x1 + gapEnd) / 2;
    const ly = bez(Math.min(1, Math.max(0, (lx - x1) / (x2 - x1))), y1, y1, y2, y2);
    labels.push({x: lx, y: ly, w, h, lines});
  }
  // Подписи, которые всё же перекрываются (из одного счёта выходит несколько стрелок), раздвигаем по вертикали.
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 0; i < labels.length; i++) for (let j = i + 1; j < labels.length; j++) {
      const A = labels[i], B = labels[j];
      const dy = (A.h + B.h) / 2 + 3 - Math.abs(A.y - B.y);
      if (Math.abs(A.x - B.x) < (A.w + B.w) / 2 && dy > 0) {
        const s = A.y <= B.y ? 1 : -1;
        A.y -= s * dy / 2; B.y += s * dy / 2; moved = true;
      }
    }
    if (!moved) break;
  }
  const labelSvg = labels.map(L => `<g><rect x="${L.x - L.w / 2}" y="${L.y - L.h / 2}" width="${L.w}" height="${L.h}" rx="6" fill="#fff" fill-opacity="0.94"/>` +
    L.lines.map((l, i) => `<text x="${L.x}" y="${L.y - L.h / 2 + 15 + i * 14}" text-anchor="middle" font-size="${l[1]}" font-weight="${l[2]}" fill="${l[3]}">${esc(l[0])}</text>`).join('') + '</g>').join('');
  let nodes = '';
  for (const n of g.nodes) {
    const p = pos[n.id];
    const ext = n.kind === 'external';
    const look = n.role === 'victim' ? ['var(--blue-bg)', 'var(--blue)'] : ext ? ['#fff', 'var(--muted)']
      : n.role === 'device' ? ['#fff', 'var(--warn)']
      : n.status === 'blocked' ? ['var(--warn-bg)', 'var(--warn)']
      : n.status === 'limited' ? ['var(--amber-bg)', 'var(--amber)'] : n.role === 'group' ? ['#fff', 'var(--line)'] : ['var(--fill)', 'var(--fill)'];
    const stroke = n.role === 'current' ? 'var(--brand)' : look[1];
    const REQ = {sent: 'Запрос отправлен', frozen: `Заморожено ${n.request ? money(n.request.frozen) : ''}`, gone: 'Деньги ушли дальше'};
    const state = n.role === 'device' ? n.model : n.role === 'group' ? 'свёрнуты, чтобы граф читался'
      : n.role === 'victim' ? 'Пострадавший' : ext ? (n.request ? REQ[n.request.status] : 'Счёт в другом банке')
      : n.status === 'blocked' ? 'Счёт приостановлен' : n.status === 'limited' ? `Заморожено ${money(n.frozen)}` : 'Счёт активен';
    const meta = n.role === 'device' ? `входят ${n.accounts} разных людей` : n.role === 'group' ? '' : ext ? `другой банк: ${n.bank || ''}` : [n.role === 'current' ? 'этот случай' : '', `счёту ${n.age_days} дн.`, n.kind === 'ip' ? 'ИП' : '',
      n.afc === 'grey' ? 'серый список' : n.afc === 'black' ? 'чёрный список' : ''].filter(Boolean).join(' · ');
    const go = n.case_id && n.case_id !== currentCase ? `data-gopen="${n.case_id}"` : '';
    nodes += `<g class="gnode" ${go}><title>${esc(n.name)}${go ? ' — открыть случай №' + n.case_id : ''}</title>
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="10" fill="${look[0]}" stroke="${stroke}"
        stroke-width="${n.role === 'current' ? 2.5 : 1}" ${n.role === 'group' || ext ? 'stroke-dasharray="4 3"' : ''}/>
      <text x="${p.x + 10}" y="${p.y + 20}" font-size="13" font-weight="700" fill="#1d1d1e">${esc(cut(n.name, 24))}</text>
      <text x="${p.x + 10}" y="${p.y + 37}" font-size="12" fill="${n.status === 'blocked' ? 'var(--warn)' : n.status === 'limited' ? 'var(--amber)' : '#2f4a3f'}">${esc(state)}</text>
      <text x="${p.x + 10}" y="${p.y + 53}" font-size="11" fill="var(--muted)">${esc(cut(meta, 30))}</text>
      ${n.tag ? `<text x="${p.x + 10}" y="${p.y + 70}" font-size="11" font-weight="600" fill="var(--warn)">${esc(cut(n.tag, 28))}</text>` : ''}</g>`;
  }
  const marker = (id, color) => `<marker id="arr-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
    markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${color}"/></marker>`;
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${currentCase ? 'Граф переводов вокруг случая' : 'Граф переводов сети'}">
    <defs>${Object.entries(LINE).map(([k, v]) => marker(k, v[0])).join('')}</defs>${edges}${labelSvg}${nodes}</svg>`;
  host.querySelectorAll('[data-gopen]').forEach(n => n.addEventListener('click', () => open(+n.dataset.gopen)));
}

        ${c.certificate ? `<p class="muted">Справка № ${esc(c.certificate.number)} выдана ${when(c.certificate.issued_at)}${c.certificate.valid ? '' : ', отозвана ' + when(c.certificate.revoked_at)}. Проверка: <a href="/verify/${esc(c.certificate.code)}" target="_blank" rel="noopener">/verify/${esc(c.certificate.code)}</a></p>` : ''}`}
    </div>
    ${c.identity ? `<div class="card linked"><h2>Счёт открыт на чужое имя</h2>
      <p>${c.identity.answer === 'not_me' ? `Владелец <b>${esc(c.identity.owner)}</b> ${when(c.identity.answered_at)} сообщил в приложении: этот счёт он не открывал.` : `Счёт открыт на имя клиента <b>${esc(c.identity.owner)}</b>.`}</p>
      <ul><li><span>Открыт ${when(c.identity.opened_at)} ${c.identity.via === 'remote' ? 'удалённо, по видео' : 'в отделении'}</span></li>
        ${c.identity.device ? `<li><span>Устройство: ${esc(c.identity.device)}${c.identity.owner_device ? '' : ' — владелец с него никогда не входил'}</span></li>` : ''}</ul>
      <p class="muted" style="margin:6px 0 0">Похоже на кражу личности: счёт открыли по чужим данным и поддельному видео. Владелец — не дроппер, его основной счёт не ограничен. Деньги на этом счёте заморожены.</p></div>` : ''}
    ${c.self_report ? `<div class="card"><h2>Клиент сам сообщил банку</h2>
      <p><b>${esc(c.self_report.kind_text)}</b></p>
      ${c.self_report.details ? `<blockquote>${esc(c.self_report.details)}</blockquote>` : ''}
      <p class="muted">Обращение ${when(c.self_report.at)}, до жалоб и ограничений по счёту. Подтверждение № ${esc(c.self_report.number)}, проверка:
        <a href="/verify/${esc(c.self_report.code)}" target="_blank" rel="noopener">/verify/${esc(c.self_report.code)}</a></p></div>` : ''}
    ${c.cash && c.cash.length ? `<div class="card"><h2>Снятие наличных</h2>
      <ul>${c.cash.map(w => `<li><span>${when(w.at)} — ${money(w.amount)}${w.foreign_amount ? `, из них ${money(w.foreign_amount)} — деньги незнакомцев за последние 5 дней` : ''}:
        ${w.status === 'done' ? (w.face ? 'снято, подтверждено по лицу в банкомате' : 'снято') :
          {cancelled: 'отменено', expired: 'клиент не пришёл к банкомату', pending: 'отложено на час', ready: 'ждёт у банкомата'}[w.status] || esc(w.status)}${w.delayed ? ' (во время звонка с подозрительного номера)' : ''}</span></li>`).join('')}</ul>
      <p class="muted" style="margin:6px 0 0">Наличные уже не вернуть. Деньги незнакомцев за последние 5 дней банкомат выдаёт только после проверки по лицу: банк знает, кто их получил.</p></div>` : ''}
    ${c.kind === 'block' ? `<div class="card"><h2>Ограничение по счёту</h2>
      ${c.scope === 'partial'
        ? `<p><b>Соразмерная блокировка: заморожено ${money(c.frozen)}.</b> Остальными деньгами клиент пользуется, но переводить может только тем, кому переводил раньше.</p>
           <p class="muted">${c.self_reported ? 'Клиент сам сообщил о пересылках, поэтому заморожены только чужие деньги.' : 'Система выбрала её, потому что по правилам клиент похож на невольного участника.'} Если вы не согласны, счёт можно закрыть целиком.</p>`
        : `<p><b>Счёт приостановлен целиком.</b>${c.frozen ? ` Спорных денег на счёте: ${money(c.frozen)}.` : ''}</p>`}
      ${c.can_escalate ? '<button class="act reject" id="escalate" style="max-width:320px">Приостановить счёт полностью</button>' : ''}
    </div>` : ''}
    ${c.graph && c.graph.edges.length ? `<div class="card"><h2>Граф: куда шли деньги</h2>
      <p class="muted" style="margin:0 0 8px">Счета и переводы вокруг случая: цепочка по жалобе, пересылки этого клиента, другие случаи с той же картой. Нажмите на счёт, чтобы открыть его случай.</p>
      <div class="graph" id="graph"></div>
      ${legend('<span><b style="background:#fff;border:2px solid var(--brand)"></b>этот случай</span>')}</div>` : ''}
    ${c.network ? `<div class="card linked"><h2>Счёт входит в сеть дропперов</h2>
      <p>В сети ${c.network.accounts} ${plural(c.network.accounts, 'счёт', 'счёта', 'счетов')}${c.network.farms ? `, ${c.network.farms} ${plural(c.network.farms, 'дроп-телефон', 'дроп-телефона', 'дроп-телефонов')}` : ''}: общий телефон или переводы между подозрительными счетами.</p>
      <button class="act reject" data-net-card="${esc(c.network.key)}" style="max-width:280px">Открыть сеть</button></div>` : ''}
    <div class="card">
      <h2>Цепочка переводов</h2>
      <div class="chain">
        ${c.incoming ? `<div class="node"><span class="muted">Отправитель</span><b>${esc(c.incoming.sender)}</b></div>
        <div class="arrow"><strong>${money(c.incoming.amount)} →</strong>${when(c.incoming.created_at)}</div>` : ''}
        <div class="node"><span class="muted">Клиент${c.incoming ? '' : ' · свои деньги'}</span><b>${esc(c.client)}</b></div>
        ${c.outgoing ? `<div class="arrow"><strong>${money(c.outgoing.amount)} →</strong>${c.incoming ? gap(c.incoming.created_at, c.outgoing.created_at) : when(c.outgoing.created_at)}</div>
        <div class="node"><span class="muted">Получатель · счёту ${days(c.outgoing.receiver_opened)} дн.</span><b>${esc(c.outgoing.receiver)}</b></div>`
        : '<div class="arrow"><strong>Деньги остаются на счёте</strong>дальше не переводились</div>'}
      </div>
    </div>
    ${c.linked ? `<div class="card linked"><h2>${c.linked.is_client ? 'Этот счёт' : 'Счёт получателя'} встречается в других случаях</h2>
      <p><b>${esc(c.linked.name)}</b>: деньги от ${c.linked.sources} разных клиентов, ${money(c.linked.amount)}, счёту ${days(c.linked.opened)} дн.
      ${c.linked.status === 'blocked' ? ' Счёт уже приостановлен.' : ''}</p>
      ${c.linked.other_cases.length ? `<p class="muted">Другие случаи: ${c.linked.other_cases.map(o => `<button class="linkbtn" data-open="${o.id}">№${o.id} ${esc(o.name)}</button> (${esc(o.kind_text)})`).join(', ')}</p>` : ''}
      ${c.linked.status !== 'blocked' ? `<button class="act reject" data-suspend-card="${c.linked.client_id}" style="max-width:280px">Приостановить счёт ${esc(c.linked.name)}</button>` : ''}
    </div>` : ''}
    ${c.rental ? `<div class="card linked"><h2>Признаки «аренды ИП»</h2>
      <ul>${c.rental.factors.map(f => `<li><span>${esc(f)}</span></li>`).join('')}</ul>
      <p class="muted" style="margin:6px 0 0">Честный магазин тоже получает деньги от незнакомцев, но платит поставщикам. Если владелец ИП передал доступ к счёту, счёт стоит приостановить целиком.</p>
      ${c.client_status !== 'blocked' && c.kind === 'intercept' ? `<button class="act reject" data-rent-card="${c.client_id}" style="max-width:280px;margin-top:10px">Приостановить счёт ИП</button>` : ''}
    </div>` : ''}
    ${c.casino ? `<div class="card linked"><h2>Признаки кассы онлайн-казино</h2>
      <ul>${c.casino.factors.map(f => `<li><span>${esc(f)}</span></li>`).join('')}</ul>
      <p class="muted" style="margin:6px 0 0">Честный продавец получает деньги от многих, но платит немногим; бригадир платит многим, но получает от немногих; перекупщик покупает у одних, а продаёт другим. Здесь одни и те же незнакомцы и платят, и получают деньги — как ставка и выигрыш.</p>
    </div>` : ''}
    ${c.guardian ? `<div class="card"><h2>Доверенное лицо клиента</h2>
      <p><b>${esc(c.guardian.name)}</b> · ${esc(GUARD[c.guardian.state] || c.guardian.state)}</p></div>` : ''}
    ${c.recruit_warned ? `<div class="card linked"><h2>Клиента предупреждали о вербовке</h2>
      <p>До этого случая система показала клиенту предупреждение: деньги от нескольких незнакомцев. Клиент ответил, что это его покупатели или знакомые.</p></div>` : ''}
    ${c.chain && c.chain.length ? `<div class="card"><h2>Цепочка по жалобе</h2>
      <p class="muted">Все счета, приостановленные по одной жалобе. Нажмите на звено, чтобы открыть его случай.</p>
      <ol class="hops">${c.chain.map(x => `<li class="${x.current ? 'cur' : ''}">
        <span class="hopn">${x.hop === 0 ? 'Пострадавший' : x.role === 'external' ? 'Другой банк' : 'Звено ' + x.hop}</span>
        ${x.case_id && !x.current ? `<button class="linkbtn" data-open="${x.case_id}">${esc(x.name)}</button>` : `<b>${esc(x.name)}</b>`}
        <span class="muted">${x.role === 'victim' ? 'перевёл ' : x.role === 'holder' ? 'деньги остались на счёте: ' : x.role === 'external' ? 'ушло в другой банк: ' : 'получил и переслал '}${money(x.amount)} · ${esc(x.status_text)}${x.frozen ? ' · заморожено ' + money(x.frozen) : ''}${x.scope === 'partial' ? ' · соразмерная блокировка' : ''}</span>
      </li>`).join('')}</ol>
      ${c.complaint ? `<p style="margin:12px 0 0"><b>Пострадавшему возвращено ${money(c.complaint.returned)} из ${money(c.complaint.amount)}.</b>
        ${c.complaint.frozen ? ` Заморожено в цепочке: ${money(c.complaint.frozen)}.` : ''}</p>` : ''}
      ${c.refundable && !(c.approval && c.approval.kind === 'refund') ? `<button class="act approve" id="refund" style="max-width:420px;margin-top:10px">Вернуть пострадавшему ${money(c.refundable)} с этого счёта</button>
        <p class="muted" style="margin:8px 0 0">${c.refundable >= 100000 ? 'Возврат от 100 000 ₸ подтверждает второй сотрудник. ' : ''}В банке для этого нужно согласие владельца счёта либо решение суда или органа уголовного преследования. В демо это кнопка.</p>` : ''}
      ${c.approval && c.approval.kind === 'refund' ? approvalBox(c.approval) : ''}
      </div>` : ''}
    <div class="grid2">
      <div class="card"><h2>Роль клиента: что учтено</h2>
        <ul>${c.role.factors.map(f => `<li>${pts(f.points)}<span>${esc(f.text)}</span></li>`).join('')}</ul></div>
      <div class="card"><h2>${c.kind === 'block' ? 'Основания для приостановки' : 'Почему сработал перехват'}: ${c.score} баллов</h2>
        <ul>${c.reasons.map(r => `<li><span class="pts">${r.points}</span><span>${esc(r.text)}</span></li>`).join('')}</ul></div>
    </div>
    <div class="card"><h2>Объяснение клиента</h2>
      ${c.explanation ? `<blockquote>${esc(c.explanation)}</blockquote>` : '<div class="muted">Клиент пока ничего не прислал.</div>'}
      ${c.documents.length ? '<h2 style="margin-top:12px">Документы</h2>' + c.documents.map(d =>
        `<div><a href="/documents/${d.id}" target="_blank" rel="noopener">${esc(d.filename)}</a> <span class="muted">${esc(d.title)}, ${Math.max(1, Math.round(d.size / 1024))} КБ</span></div>`).join('') : ''}
    </div>
    <div class="card"><h2>История случая</h2>
      <ul class="timeline">${(c.history || []).map(h => `<li><span class="muted">${when(h.at)}</span>
        <span><b>${esc(h.text)}</b> <span class="who">· ${esc(h.who)}</span>
        ${h.details.comment ? `<br><span class="muted">«${esc(h.details.comment)}»</span>` : ''}
        ${h.details.role ? `<br><span class="muted">Подсказка системы в момент решения: ${esc(h.details.role)}</span>` : ''}
        ${h.details.filename ? `<br><span class="muted">${esc(h.details.filename)}</span>` : ''}</span></li>`).join('') || '<li class="muted">Записей пока нет</li>'}</ul>
    </div>
    <div class="card"><h2>Антифрод-центр Нацбанка</h2>
      <p class="muted">Сведения по случаю для передачи в Антифрод-центр: клиент, операции, признаки, цепочка, решение. Формат условный, технических данных (IP, геолокация, номера) в демо нет.</p>
      <button class="act" id="report" style="background:var(--line);max-width:320px">Выгрузить сведения (JSON)</button>
    </div>
`;
  if ($('graph')) drawGraph($('graph'), c.graph, c.case_id);
  bindApproval(() => open(id));
  $('piiShow').onclick = () => { $('piiAsk').hidden = false; $('piiShow').hidden = true; };
  $('piiOpen').onclick = async () => {
    try {
      const p = await api(`/analyst/clients/${c.client_id}/pii`, {reason: $('piiReason').value});
      $('piiIin').textContent = p.iin; $('piiPhone').textContent = p.phone; $('piiAsk').hidden = true;
      $('piiNote').textContent = 'Просмотр записан в журнал с причиной. Клиент увидит его в приложении: «Кто смотрел мои данные».';
    } catch (e) { $('piiNote').textContent = e.message; }
  };
  $('detail').querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(+b.dataset.open));
  $('detail').querySelectorAll('[data-net-card]').forEach(b => b.onclick = () => goNetwork(b.dataset.netCard));
  $('detail').querySelectorAll('[data-suspend-card]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const n = await api(`/analyst/accounts/${b.dataset.suspendCard}/suspend`, {}); open(n.case_id); }
    catch (e) { b.disabled = false; alertBox(e.message); }
  });
  $('detail').querySelectorAll('[data-rent-card]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const n = await api(`/analyst/business/${b.dataset.rentCard}/suspend`, {}); open(n.case_id); }
    catch (e) { b.disabled = false; alertBox(e.message); }
  });
  for (const [btn, path] of [['escalate', 'escalate'], ['refund', 'refund']]) if ($(btn)) $(btn).onclick = async () => {
    $(btn).disabled = true;
    try { await api(`/analyst/cases/${id}/${path}`, {}); await open(id); }
    catch (e) { alertBox(e.message); if ($(btn)) $(btn).disabled = false; }
  };
  $('report').onclick = async () => {
    const r = await fetch(`/analyst/cases/${id}/report`, {method: 'POST'});
    if (!r.ok) return alertBox('Не удалось выгрузить сведения');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob()); a.download = `antifraud-case-${id}.json`; a.click();
    URL.revokeObjectURL(a.href); open(id);
  };
  if (c.needs_decision) for (const d of ['approve', 'reject']) $(d).onclick = async () => {
    try { await api(`/analyst/cases/${id}/decision`, {decision: d, comment: $('comment').value}); await open(id); }
    catch (e) { $('err').innerHTML = `<div class="note">${esc(e.message)}</div>`; }
  };
  loadQueue();
}

function showLogin() { $('login').hidden = false; for (const id of ['wrap', 'reset', 'logout']) $(id).hidden = true; }
function showPanel() { $('login').hidden = true; for (const id of ['wrap', 'reset', 'logout']) $(id).hidden = false; loadMe(); loadQueue(); if (window.tourResume) tourResume(); }
// Кто сейчас работает в панели. В демо можно войти как второй сотрудник, чтобы подтвердить действие.
async function loadMe() {
  me = await api('/analyst/employees');
  const other = Object.entries(me.employees).find(([k]) => k !== me.employee);
  $('emp').innerHTML = `Сотрудник: <b>${esc(me.name)}</b>` + (other ? ` · <button class="linkbtn" id="empSwitch">Демо: войти как ${esc(other[1])}</button>` : '');
  if (other) $('empSwitch').onclick = async () => {
    me = await api('/analyst/employee', {employee: other[0]});
    await loadMe();
    if (current) open(current); else if (currentNet) openNetwork(currentNet); else loadQueue();
  };
}
// Действие ждёт второго сотрудника: тот, кто просил, может только отменить свою просьбу.
function approvalBox(a) {
  const mine = a.requested_by === me.name;
  return `<div class="twokey"><b>Ждёт второго сотрудника:</b> ${esc(a.summary)}.<br>
    <span>Запросил(а) ${esc(a.requested_by)}, ${when(a.requested_at)}. ${mine ? 'Подтвердить должен другой сотрудник: правило двух ключей.' : ''}</span></div>
    <div class="actions">${mine ? '' : `<button class="act approve" data-ok="${a.id}">Подтвердить</button>`}
      <button class="act reject" data-no="${a.id}">${mine ? 'Отменить запрос' : 'Отклонить'}</button></div>`;
}
function bindApproval(after) {
  $('detail').querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/analyst/approvals/${b.dataset.ok}/confirm`, {}); await after(); }
    catch (e) { b.disabled = false; alertBox(e.message); }
  });
  $('detail').querySelectorAll('[data-no]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/analyst/approvals/${b.dataset.no}/reject`, {}); await after(); }
    catch (e) { b.disabled = false; alertBox(e.message); }
  });
}
$('login').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({role:'analyst', pin:$('pin').value, employee:$('empSel').value})});
  if (r.ok && new URLSearchParams(location.search).get('next') === 'stats') { location.href = '/analyst/stats'; return; }
  if (r.ok) { $('pin').value = ''; $('loginErr').innerHTML = ''; showPanel(); }
  else $('loginErr').innerHTML = `<div class="note">${esc((await r.json().catch(() => ({}))).detail || 'Не удалось войти')}</div>`;
};
$('logout').onclick = async () => { await fetch('/logout?role=analyst', {method:'POST'}); showLogin(); };
$('reset').onclick = async () => {
  $('reset').disabled = true;
  try { await api('/demo/reset', {}); current = null; $('detail').innerHTML = '<div class="card muted">Демо-данные возвращены в исходное состояние.</div>'; await loadQueue(); }
  finally { $('reset').disabled = false; }
};
fetch('/me').then(r => r.ok ? r.json() : null).then(s => s && s.analyst ? showPanel() : showLogin());
</script>
<script src="/tour.js"></script>
</body>
</html>
