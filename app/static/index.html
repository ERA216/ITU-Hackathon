<title>Clean Break</title>
<style>
  /* Цвета и формы как в приложении bcc.kz: светлый мятный фон, белые карточки, зелёный акцент. */
  :root { --bg:#f5f5fa; --card:#fff; --ink:#1d1d1e; --ink2:#00875c; --muted:#587366; --line:#d6eadf; --fill:#f2f3f7;
          --brand:#00ab75; --brand-ink:#00875c; --brand-bg:#e6f7f0;
          --warn:#c62828; --warn-bg:#fdeeee; --amber:#6b4a00; --amber-bg:#fff5df; --blue:#1f3a8a; --blue-bg:#eef2fd;
          --ok:#00875c; --ok-bg:#e6f7f0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.45 "Roboto Flex", Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
         -webkit-font-smoothing:antialiased; }
  .phone { max-width:420px; margin:0 auto; min-height:100vh; padding:12px 16px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 0 10px; }
  header b { font-size:20px; font-weight:700; letter-spacing:-.01em; color:var(--ink); white-space:nowrap; }
  select, input, button { font:inherit; color:inherit; }
  select, input { width:100%; padding:12px 14px; border:1px solid transparent; border-radius:12px; background:var(--fill); }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--brand); background:#fff; }
  header select { width:auto; max-width:62%; padding:8px 12px; font-size:14px; font-weight:500; background:#fff; border-radius:20px; }
  .card { background:var(--card); border:0; border-radius:16px; padding:16px; margin-bottom:12px; }
  .balance { font-size:32px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin:2px 0; }
  .muted { color:var(--muted); font-size:14px; }
  h2 { font-size:18px; font-weight:700; margin:0 0 12px; letter-spacing:-.01em; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  button { border:0; border-radius:12px; padding:13px 16px; font-weight:500; cursor:pointer; width:100%; }
  .primary { background:var(--brand); color:#fff; margin-top:14px; }
  .primary:hover { background:#009d6b; }
  .ghost { background:transparent; color:var(--muted); font-weight:500; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; padding-top:4px; }
  .amt { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; }
  .in { color:var(--ok); }
  .tag { display:inline-block; font-size:12px; font-weight:500; padding:2px 8px; border-radius:6px; background:var(--fill); color:var(--muted); }
  .tag.held { background:var(--warn-bg); color:var(--warn); }
  .note { border-radius:12px; padding:12px 14px; font-size:14px; margin-top:12px; }
  .note.ok { background:var(--ok-bg); color:var(--ok); }
  .note.err { background:var(--warn-bg); color:var(--warn); }
  /* «Светофор получателя»: риск получателя до перевода. */
  .risk { display:flex; gap:10px; align-items:flex-start; border-radius:12px; padding:10px 12px; margin-top:8px; font-size:14px; }
  .risk i { flex:0 0 12px; width:12px; height:12px; border-radius:50%; background:currentColor; margin-top:4px; }
  .risk b { display:block; }
  .risk.red { background:var(--warn-bg); color:var(--warn); }
  .risk.yellow { background:var(--amber-bg); color:var(--amber); }
  .risk.green { background:var(--ok-bg); color:var(--ok); }
  .overlay { position:fixed; inset:0; background:rgba(10,48,36,.45); display:none; align-items:flex-end; justify-content:center; }
  .overlay.show { display:flex; }
  .sheet { background:#fff; width:100%; max-width:420px; border-radius:24px 24px 0 0; padding:10px 16px 16px; max-height:92vh; overflow:auto; }
  .sheet::before { content:""; display:block; width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px; }
  .sheet h2 { font-size:20px; color:var(--ink); }
  .sheet ul { padding-left:20px; margin:10px 0; }
  .sheet li { margin:6px 0; }
  .sheet .ghost { margin-top:4px; padding:11px 16px; }
  .law { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 14px; font-size:14px; margin:12px 0; }
  .blocked h2 { font-size:18px; margin-top:4px; }
  .status { display:inline-block; font-size:12px; font-weight:500; padding:3px 10px; border-radius:6px;
            background:var(--warn-bg); color:var(--warn); margin-bottom:8px; }
  .status.review { background:var(--amber-bg); color:var(--amber); }
  .status.done { background:var(--ok-bg); color:var(--ok); }
  .doc { background:var(--fill); border-radius:12px; padding:10px 12px; margin-top:8px; font-size:14px; }
  .doc b { display:block; font-weight:500; }
  .doc input { border:0; padding:6px 0 0; background:none; }
  .doc .have { color:var(--ok); }
  textarea { width:100%; min-height:96px; padding:12px 14px; border:1px solid transparent; border-radius:12px; background:var(--fill);
             font:inherit; color:inherit; resize:vertical; }
  details { margin-top:10px; font-size:14px; }
  summary { cursor:pointer; color:var(--brand-ink); font-weight:500; }
  [hidden] { display:none !important; }
  button.link { width:auto; padding:0 4px; background:none; color:var(--brand-ink); font-weight:500; }
  button:disabled { opacity:.55; cursor:default; }
  .alert { background:var(--amber-bg); color:var(--amber); border-radius:16px; padding:16px; margin-bottom:12px; }
  .alert.hot { background:var(--warn-bg); color:var(--warn); }
  .alert h2 { color:inherit; font-size:17px; margin-bottom:6px; }
  .alert p { margin:6px 0; font-size:15px; }
  .alert .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .alert .actions button { flex:1 1 150px; margin:0; }
  .soft { background:rgba(0,135,92,.09); color:inherit; }
  .card .soft, .demo .soft { background:var(--fill); color:var(--ink); }
  .tag.warn { background:var(--amber-bg); color:var(--amber); }
  .confirm { margin-top:6px; font-size:14px; }
  .confirm button { width:auto; padding:7px 12px; font-size:14px; margin:6px 6px 0 0; }
  .langs { display:flex; gap:2px; background:#fff; border-radius:20px; padding:3px; }
  .langs button { width:auto; padding:5px 12px; font-size:13px; font-weight:500; border-radius:16px; background:none; color:var(--muted); }
  .langs button[aria-pressed="true"] { background:var(--ink2); color:#fff; }
  .demo { border:1px dashed #b9dccb; border-radius:16px; padding:14px; margin-top:4px; }
  .demo button { margin-top:8px; }
  .alert.call { background:var(--warn); color:#fff; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 14px; }
  .top a { font-size:14px; color:var(--muted) !important; text-decoration:none; }
  .alert.guard { background:var(--blue-bg); color:var(--blue); }
  .alert.recruit { background:var(--warn-bg); color:var(--warn); }
  .alert ul { margin:6px 0; padding-left:20px; font-size:14px; }
  .cert { background:var(--ok-bg); color:var(--ok); }
  .cert h2 { color:inherit; }
  a.btn { display:block; text-align:center; text-decoration:none; border-radius:12px; padding:13px 16px; font-weight:500;
          background:var(--brand); color:#fff; margin-top:10px; }
  .guardian select { margin-top:6px; }
  .alert.cool { background:var(--amber-bg); color:var(--amber); }
  .msgres { border-radius:12px; padding:12px 14px; margin-top:12px; font-size:15px; }
  .msgres h3 { margin:0 0 6px; font-size:16px; }
  .msgres.danger { background:var(--warn-bg); color:var(--warn); }
  .msgres.caution { background:var(--amber-bg); color:var(--amber); }
  .msgres.none { background:var(--ok-bg); color:var(--ok); }
  .msgres ol, .msgres ul { margin:6px 0; padding-left:20px; }
  .msgres .hit { background:rgba(0,0,0,.08); border-radius:4px; padding:0 4px; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { width:auto; padding:7px 12px; font-size:13px; margin:0; border-radius:20px; }
  .alert.done { background:var(--ok-bg); color:var(--ok); }
  .opt { display:flex; gap:10px; align-items:flex-start; color:var(--ink); font-size:15px; background:var(--fill);
         border:1px solid transparent; border-radius:12px; padding:12px; margin:8px 0; cursor:pointer; }
  .opt:has(input:checked) { border-color:var(--brand); background:#fff; }
  .opt input { width:auto; margin-top:4px; flex:none; accent-color:var(--brand); }
  .opt .muted { display:block; }
  .refund { background:var(--ok-bg); color:var(--ink); border-radius:12px; padding:12px 14px; margin:12px 0; font-size:14px; }
  .refund button { margin-top:10px; }
  #callToggle { background:var(--warn); color:#fff; }
  #callToggle:hover { background:#a91f1f; }
  .examples button.soft { background:var(--amber-bg); color:var(--amber); }
  .examples button.soft:hover { background:#ffeec2; }
  /* Раскладка: слева подсказки для показа, справа телефон с экраном клиента. */
  body { background:var(--bg); }
  .app { display:flex; gap:32px; justify-content:center; align-items:flex-start; padding:24px; }
  .demo-panel { width:330px; flex:none; position:sticky; top:24px; }
  .demo-toggle { display:none; }
  .demo-body { background:#fff; border:0; border-radius:20px; padding:20px; }
  .demo-title { font-size:20px; font-weight:700; margin-bottom:4px; }
  .demo-body .muted { font-size:13px; }
  .demo-body p { margin:4px 0 0; }
  .hint { background:var(--fill); color:var(--ink); border-radius:12px; padding:12px 14px; font-size:14px; margin:10px 0 0; }
  .hint b { display:block; margin-bottom:4px; }
  .hint p { margin:0; }
  .hint ul { margin:6px 0 0; padding-left:18px; }
  .hint li { margin:4px 0; }
  .demo-body #who { background:#00ab75; color:#fff; border:1px solid #00ab75; font-weight:500; }
  .demo-body #who option { background:#fff; color:#1d1d1e; }
  .demo-sec { border-top:1px solid var(--line); margin-top:16px; padding-top:14px; }
  .demo-sec .opt { font-size:14px; padding:8px 10px; margin:6px 0 0; }
  .demo-links { display:flex; flex-wrap:wrap; gap:6px 16px; border-top:1px solid var(--line); margin-top:16px; padding-top:14px; }
  .demo-links a { color:var(--brand-ink); font-size:14px; font-weight:500; text-decoration:none; }
  .device { position:relative; width:400px; flex:none; height:min(860px, calc(100vh - 106px)); background:var(--bg);
            border-radius:40px; box-shadow:0 0 0 10px #0f3d2e, 0 24px 60px rgba(0,0,0,.22); overflow:hidden;
            display:flex; flex-direction:column; }
  .screen { flex:1; overflow-y:auto; padding:18px 16px 24px; scrollbar-width:none; }
  .screen::-webkit-scrollbar { display:none; }
  .hello { display:flex; align-items:center; gap:12px; padding:0 0 14px; }
  .avatar { width:42px; height:42px; flex:none; border-radius:50%; background:var(--brand-bg); color:var(--brand-ink);
            display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
  .hello .who { flex:1; min-width:0; line-height:1.25; }
  .hello .who .muted { font-size:13px; }
  .hello .who b { display:block; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hero { padding:18px 16px 16px; }
  .hero .balance { font-size:34px; }
  .quick { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:16px; }
  .quick button { background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:6px;
                  font-size:12px; font-weight:500; color:var(--ink); line-height:1.2; }
  .quick .ic { width:48px; height:48px; border-radius:14px; background:var(--fill); color:var(--brand-ink);
               display:flex; align-items:center; justify-content:center; }
  .quick button:hover .ic { background:#e7e9f0; }
  svg.i { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tabbar { display:flex; background:#fff; border-top:1px solid var(--line); padding:6px 6px 12px; flex:none; }
  .tabbar button { flex:1; background:none; padding:6px 0 0; display:flex; flex-direction:column; align-items:center; gap:3px;
                   font-size:11px; font-weight:500; color:var(--muted); border-radius:0; }
  .tabbar button[aria-current="true"] { color:var(--brand-ink); }
  .toast { position:absolute; left:12px; right:12px; bottom:76px; z-index:5; pointer-events:none; }
  .toast .note { margin:0; box-shadow:0 8px 24px rgba(0,0,0,.14); pointer-events:auto; cursor:pointer; }
  .toast .note.ok { background:#0f3d2e; color:#fff; }
  .toast .note.err { background:#fff; color:var(--warn); border:1px solid #f6caca; }
  .overlay { position:absolute; z-index:10; }
  /* Окно остановки не выше рамки телефона: иначе его верх с заголовком обрезался и до него нельзя было долистать. */
  .sheet { max-width:none; max-height:92%; }
  .row { align-items:flex-start; }
  .row .ico { width:36px; height:36px; flex:none; border-radius:50%; background:var(--fill); color:var(--muted);
              display:flex; align-items:center; justify-content:center; }
  .row .ico.in { background:var(--brand-bg); color:var(--brand-ink); }
  .row .ico svg.i { width:18px; height:18px; }
  .row .body { flex:1; min-width:0; }
  .row .body .tag { margin-top:4px; }
  .pane-title { font-size:22px; font-weight:700; margin:2px 0 14px; }
  /* Главная: самое важное предупреждение целиком, остальные свёрнуты до заголовка. */
  .alert.compact { padding:12px 16px; }
  .alert.compact > h2 { display:flex; align-items:center; gap:10px; margin:0; cursor:pointer; font-size:16px; }
  .alert.compact > h2::after { content:""; margin-left:auto; flex:none; width:8px; height:8px; margin-right:4px;
                              border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(-45deg); }
  .alert.compact.open > h2 { margin-bottom:6px; }
  .alert.compact.open > h2::after { transform:rotate(45deg); }
  .alert.compact:not(.open) > :not(h2) { display:none; }
  /* Операции: кружок с инициалами того, с кем был перевод. */
  .row .ico { font-size:14px; font-weight:700; letter-spacing:.02em; }
  /* «Подробнее»: видна главная фраза, длинное объяснение свёрнуто. */
  details.more { margin:2px 0 8px; font-size:inherit; }
  details.more summary { font-size:14px; }
  details.more p { margin:6px 0 0; }
  .alert details.more summary { color:inherit; text-decoration:underline; text-underline-offset:3px; }
  .brief > p:first-child { margin-top:0; }
  .brief > p { margin-bottom:4px; }
  /* Вкладки «Переводы» и «Защита» — аккордеон: открыта одна карточка, у остальных видны заголовок и строка о том, что внутри. */
  .acc { background:#fff; border:0; border-radius:16px; margin-bottom:12px; }
  .acc:not(:has(> .acc-item > .card:not([hidden]))) { display:none; }
  .acc-item + .acc-item { border-top:1px solid var(--line); }
  .acc-item:has(> .card[hidden]) { display:none; }
  .acc-item:has(> .card[hidden]) + .acc-item { border-top:0; }
  .acc-head { display:flex; align-items:center; gap:12px; background:none; border-radius:16px; padding:14px 16px; text-align:left; color:var(--ink); font-weight:400; }
  .acc-head > span { flex:1; min-width:0; }
  .acc-head b { display:block; font-size:16px; font-weight:700; }
  .acc-head .muted { display:block; font-size:13px; margin-top:2px; }
  .acc-head:hover b { color:var(--brand-ink); }
  .acc-head::after { content:""; flex:none; width:8px; height:8px; margin-right:4px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform .15s; }
  .acc-item.open > .acc-head::after { transform:rotate(45deg); }
  .acc-item:not(.open) > .card { display:none; }
  .acc .card { background:none; border:0; border-radius:0; margin:0; padding:0 16px 16px; }
  .acc .card > h2:first-child { display:none; }
  .acc .card > h2:first-child + * { margin-top:0; }
  @media (max-width:860px) {
    body { background:var(--bg); }
    .app { display:block; padding:0; }
    .demo-panel { width:auto; position:static; padding:10px 12px 0; }
    .demo-toggle { display:flex; justify-content:space-between; align-items:center; width:100%; background:#0f3d2e; color:#fff;
                   border-radius:12px; padding:11px 14px; font-size:14px; }
    .demo-toggle::after { content:"▾"; }
    .demo-panel.open .demo-toggle::after { content:"▴"; }
    .demo-body { display:none; margin-top:8px; }
    .demo-panel.open .demo-body { display:block; }
    .device { width:auto; height:calc(100dvh - 196px); min-height:520px; border-radius:0; box-shadow:none; margin-top:10px; }
  }
  /* Общее верхнее меню: четыре страницы проекта, текущая выделена. */
  .topbar { display:flex; justify-content:flex-start; align-items:center; gap:16px; flex-wrap:wrap; padding:10px 20px; background:#fff; border-bottom:1px solid #d6eadf; }
  .topbar .brand { font-weight:700; font-size:14px; letter-spacing:.07em; text-transform:uppercase; color:#1d1d1e; text-decoration:none; white-space:nowrap;
                   display:inline-flex; align-items:center; gap:8px; }
  .topbar .brand .logo { width:24px; height:24px; flex:none; }
  .pages { display:flex; gap:6px; background:none; border-radius:20px; padding:0; overflow-x:auto; scrollbar-width:none; }
  .pages::-webkit-scrollbar { display:none; }
  .pages a { padding:7px 14px; border-radius:17px; border:0; background:none; font-size:14px; font-weight:500; color:#1d1d1e; text-decoration:none; white-space:nowrap; margin:0; }
  .pages a:hover { background:#e6f7f0; }
  .pages a[aria-current="page"] { background:#00ab75; color:#fff; }
  .topbar .tools { margin-left:auto; display:flex; gap:8px; }
  @media (max-width:700px) {
    .topbar { padding:10px 12px; gap:8px 10px; }
    .pages { order:3; width:100%; display:grid; grid-template-columns:1fr 1fr; }
    .pages a { text-align:center; padding:7px 8px; border-radius:11px; }
  }
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/"><svg class="logo" viewBox="7.25 8 52 52" aria-hidden="true"><path d="M8 26 20 14l6 12z" fill="#7ad9b4"/><path d="M20 14h12l-6 12z" fill="#c9eedf"/><path d="M26 26l6-12v12z" fill="#00ab75"/><path d="M8 26h18l6 30z" fill="#00ab75"/><path d="M26 26h6v30z" fill="#00875c"/><g transform="translate(2.5 -2)"><path d="M32 14l6 12h-6z" fill="#00875c"/><path d="M32 14h12l-6 12z" fill="#7ad9b4"/><path d="M44 14l12 12H38z" fill="#00ab75"/><path d="M32 26h6L32 56z" fill="#0f3d2e"/><path d="M38 26h18L32 56z" fill="#00875c"/></g></svg><span data-t="app">Clean Break</span></a>
  <nav class="pages" aria-label="Страницы проекта"><a href="/client" aria-current="page" data-t="navClient">Экран клиента</a><a href="/analyst" data-t="navStaff">Панель аналитика</a><a href="/analyst/stats" data-t="navStats">Эффективность</a><a href="/quality" data-t="navQuality">Качество движка</a></nav></header>
<div class="app">
  <aside class="demo-panel" id="demoPanel">
    <button class="demo-toggle" id="demoToggle" data-t="demoToggle"></button>
    <div class="demo-body">
      <div class="demo-title" data-t="demoTitle"></div>
      <p class="muted" data-t="demoIntro"></p>
      <label for="who" data-t="who"></label>
      <select id="who"></select>
      <p class="hint" id="personaHint"></p>
      <div class="demo-sec">
        <div class="muted brief" data-tb="demoH"></div>
        <button class="soft" id="callToggle"></button>
      </div>
      <div class="demo-sec">

const cookieLang = (document.cookie.match(/(?:^|; )ca_lang=(ru|kk)/) || [])[1];

// выражении: её нет в Safari до iOS 16.4, и там весь экран клиента не запускался бы.
const tr = (key, vars = {}) => T[key][L === 'kk' ? 1 : 0].replace(/\{(\w+)\}/g, (_, k) => vars[k]).replace(/\.{2,}/g, m => m.length === 2 ? '.' : m);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

// Короткие тексты: видна первая, главная фраза, остальное объяснение — под «Подробнее». keepLast: последняя фраза
// (что делать) тоже видна. Делим готовый текст по фразам, поэтому новых переводов не нужно.
const more = (text, cls = '') => `<details class="more ${cls}"><summary>${tr('moreH')}</summary><p>${esc(text)}</p></details>`;
const sentences = text => (text.match(/[\s\S]*?[.!?]+[»")]*\.?(?=\s+[«"A-ZА-ЯЁӘҒҚҢӨҰҮҺІ0-9+]|\s*$)/g) || [])
  .map(x => x.trim()).filter(Boolean);
function brief(text, {keepLast = false, cls = ''} = {}) {
  const s = sentences(text);
  if (s.length < 2 || s.join(' ').length < text.trim().length - 2) return `<p class="${cls}">${esc(text)}</p>`;
  const last = keepLast && s.length > 2;
  const shown = last ? [s[0], s[s.length - 1]] : [s[0]], hidden = last ? s.slice(1, -1) : s.slice(1);
  return `<p class="${cls}">${esc(shown.join(' '))}</p>` + more(hidden.join(' '), cls);
}

}

async function api(path, body, retried) {
  // Номер персонажа на этом экране: если в другой вкладке вошли под другим, сервер не выполнит действие от его имени.
  const headers = me && path !== '/login' ? {'X-Client-Id': String(me)} : {};
  const r = await fetch(path, body ? {method:'POST', headers:{...headers, 'Content-Type':'application/json'}, body:JSON.stringify(body)} : {headers});
  const data = await r.json().catch(() => ({}));
  if (r.status === 409 && r.headers.get('X-Session-Changed') && !retried) {
    await fetch('/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({role: 'client', client_id: me})});
    return api(path, body, true);
  }
  if (!r.ok) { const e = new Error(typeof data.detail === 'string' ? data.detail : tr('requestError')); e.status = r.status; throw e; }
  return data;
}
// Сообщение всплывает над нижним меню на любой вкладке и само исчезает.

  $('note').innerHTML = text ? `<div class="note ${kind}" role="status">${esc(text)}</div>` : '';

}

// Казахские названия месяцев свои: в части браузеров нет данных для kk-KZ, и дата выходит как «M11 19».
const KK_MONTHS = ['қаңтар', 'ақпан', 'наурыз', 'сәуір', 'мамыр', 'маусым', 'шілде', 'тамыз', 'қыркүйек', 'қазан', 'қараша', 'желтоқсан'];
function dateText(s, time = true) {
  const d = new Date(s);
  if (L !== 'kk') return time ? d.toLocaleString('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'})
                              : d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return `${d.getDate()} ${KK_MONTHS[d.getMonth()]}` + (time ? `, ${hm}` : '');
}
const when = s => dateText(s);
// Операции: кружок с инициалами того, с кем был перевод (до двух букв из слов с заглавной: «ИП Асель» — «ИА»).
// У кредита — знак тенге, у снятия наличных — купюра.
const CASH_ICON = '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>';
const initials = name => String(name || '').replace(/[«»"()…]/g, ' ').split(/\s+/)
  .filter(w => /^[A-ZА-ЯЁӘҒҚҢӨҰҮҺІ]/.test(w)).slice(0, 2).map(w => w[0]).join('') || '•';

// Вкладки внизу экрана: главная, переводы, защита. Если нужна карточка из аккордеона, она раскрывается.
function showTab(name, focus) {
  document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== name);
  document.querySelectorAll('.tabbar [data-go]').forEach(b => b.setAttribute('aria-current', String(b.dataset.go === name)));
  const el = focus && $(focus), item = el && el.closest('.acc-item');
  if (item) openAcc(item);
  if (el && !el.hidden) (item || el).scrollIntoView({behavior: 'smooth', block: 'start'});
  else $('screen').scrollTo({top: 0});
}
// Аккордеон на вкладках «Переводы» и «Защита»: открыта одна карточка, повторное нажатие её сворачивает.
function openAcc(item, open = true) {
  item.parentElement.querySelectorAll(':scope > .acc-item').forEach(x => {
    const on = open && x === item;
    x.classList.toggle('open', on);
    x.querySelector('.acc-head').setAttribute('aria-expanded', String(on));
  });
}
// После входа под персонажем раскрыта первая карточка, которая у него есть (у приостановленного счёта сейфа нет).
let accFresh = true;
function resetAcc() { accFresh = true; }
// Скрытая карточка прячет и свой заголовок, пустой аккордеон — целиком. То же делает CSS через :has, но его нет
// в Safari до 15.4 и Firefox до 121.
function syncAcc() {
  document.querySelectorAll('.acc').forEach(a => {
    const items = [...a.children];
    items.forEach(it => { it.hidden = it.querySelector(':scope > .card').hidden; });
    a.hidden = items.every(it => it.hidden);
  });
}
function openFirstAcc() {
  syncAcc();
  if (!accFresh) return;
  accFresh = false;
  document.querySelectorAll('.acc').forEach(a => {
    const first = [...a.children].find(x => !x.querySelector(':scope > .card').hidden);
    if (first) openAcc(first);
  });
}
document.querySelectorAll('.acc-head').forEach(h => h.onclick = () => {
  const item = h.parentElement, open = !item.classList.contains('open');
  openAcc(item, open);
  if (open) item.scrollIntoView({behavior: 'smooth', block: 'nearest'});
});
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => showTab(b.dataset.go, b.dataset.focus));

// Шапка экрана и подсказка в демо-панели для выбранного персонажа.
function renderMe() {
  const p = people.find(x => x.id === me);
  if (!p) return;
  const name = p.name.split(' (')[0];
  $('meName').textContent = name;
  $('avatar').textContent = (name.replace(/[«»"]/g, '').trim()[0] || '?').toUpperCase();
  const story = (p.name.match(/\((.+)\)$/) || [])[1];
  const hint = T['hint_' + me] ? sentences(tr('hint_' + me)) : [];
  // История и первая фраза подсказки не повторяют друг друга: остаётся более подробная.
  const norm = s => s.toLowerCase().replace(/[^\p{L}]/gu, '');
  let showStory = !!story;
  if (story && hint.length) {
    if (norm(story).includes(norm(hint[0]))) hint.shift();
    else if (norm(hint[0]).startsWith(norm(story))) showStory = false;
  }
  $('personaHint').innerHTML = (showStory ? `<b>${esc(story.replace(/\p{L}/u, ch => ch.toUpperCase()))}</b>` : '') +
    (hint.length ? `<p>${esc(hint[0])}</p>` : '') +
    (hint.length > 1 ? `<ul>${hint.slice(1).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '');
  $('personaHint').hidden = !showStory && !hint.length;
}

// Персонажи в демо-панели по историям: так проще найти нужного.
const GROUPS = [['grpProtect', [1001, 1004, 1013, 1022]], ['grpVictims', [1002, 1006, 1018]],
                ['grpUnwitting', [1005, 1019, 1020, 1010, 1012, 1021]], ['grpFraud', [1003, 1007, 1008, 1009]],
                ['grpBiz', [1011, 1014, 1015]]];
async function loadPeople() {
  people = await api('/demo/clients');
  // Под счетами в другом банке войти нельзя: они есть только среди получателей.
  const own = people.filter(p => !p.external), byId = Object.fromEntries(own.map(p => [p.id, p])), used = new Set();
  // В списке — короткие имена: что с персонажем случилось, видно в подсказке под списком.
  const group = (label, ids) => ids.length ? `<optgroup label="${esc(label)}">${ids.map(i => `<option value="${i}">${esc(byId[i].name.split(' (')[0])}</option>`).join('')}</optgroup>` : '';
  $('who').innerHTML = GROUPS.map(([key, ids]) => {

async function loadBlock() {
  appeal = await api(`/clients/${me}/case`);
  const cls = {under_review:'review', unblocked:'done'}[appeal.status] || '';
  let html = `<span class="status ${cls}">${esc(appeal.status_text)}</span>
    <h2>${tr(appeal.scope === 'partial' ? 'limitedH' : 'blockedH')}</h2>
    <p>${esc(appeal.summary)}</p>
    <details><summary>${tr('whatNoticed')}</summary><ul>${appeal.reasons.map(r => `<li>${esc(r.text)}</li>`).join('')}</ul></details>`;
  if (appeal.status === 'under_review' && appeal.due_at) {
    const d = dateText(appeal.due_at, false);
    html += `<p><b>${esc(tr('due', {d}))}</b> ${tr('dueMore')}</p>`;
  }
  if (appeal.refundable) html += `<div class="refund">${esc(tr('refundHint', {m: money(appeal.refundable)}))}
      <button class="primary" id="refundBtn">${esc(tr('refundBtn', {m: money(appeal.refundable)}))}</button></div>`;
  if (appeal.can_submit) {
    html += `<h2 style="color:inherit;margin-top:16px">${tr('needH')}</h2>
      <label for="expl">${tr('explLabel')}</label>
      <textarea id="expl" maxlength="2000" placeholder="${esc(tr('explPh'))}"></textarea>` +
      appeal.required.map(d => `<div class="doc"><b>${esc(d.title)}${d.required ? '' : tr('ifAny')}</b>
        ${d.uploaded ? '<span class="have">' + tr('uploaded') + appeal.documents.filter(x => x.kind === d.kind).map(x => esc(x.filename)).join(', ') + '</span>' : ''}
        <input type="file" accept="image/png,image/jpeg,application/pdf" data-kind="${esc(d.kind)}" aria-label="${esc(d.title)}"></div>`).join('') +
      `<p class="muted">${esc(tr('fileHint', {n: appeal.max_documents}))}</p>
      <button class="primary" id="submitAppeal">${tr('submit')}</button>`;
  } else {
    if (appeal.documents.length) html += `<p class="muted">${esc(tr('youSent', {f: appeal.documents.map(d => d.filename).join(', ')}))}</p>`;
    if (appeal.decision_comment) html += `<div class="note err"><b>${tr('bankAnswer')}</b> ${esc(appeal.decision_comment)}</div>`;
  }
  html += `<div id="blockNote"></div><p class="muted">${tr('antifraudNote')}</p>`;
  const kept = $('expl') ? $('expl').value : '';
  $('blockCard').innerHTML = html;
  if ($('expl')) $('expl').value = kept;
  const bnote = (t, k) => $('blockCard').querySelector('#blockNote').innerHTML = `<div class="note ${k}">${esc(t)}</div>`;
  $('blockCard').querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      if (f.size > 5 * 1024 * 1024) throw new Error(tr('fileTooBig'));
      const b64 = await new Promise((ok, bad) => { const r = new FileReader();
        r.onload = () => ok(r.result.split(',')[1]); r.onerror = bad; r.readAsDataURL(f); });
      await api(`/cases/${appeal.case_id}/documents`, {kind: inp.dataset.kind, filename: f.name, content_base64: b64});
      await loadBlock();
    } catch (e) { bnote(e.message, 'err'); }
  });
  const rbtn = $('blockCard').querySelector('#refundBtn');
  if (rbtn) rbtn.onclick = async () => {
    rbtn.disabled = true;
    try { const r = await api(`/cases/${appeal.case_id}/refund`, {}); await load(); bnote(tr('refundOk', {m: money(r.amount)}), 'ok'); }
    catch (e) { bnote(e.message, 'err'); }
  };
  const btn = $('blockCard').querySelector('#submitAppeal');
  if (btn) btn.onclick = async () => {
    try { await api(`/cases/${appeal.case_id}/submit`, {explanation: $('expl').value}); await loadBlock(); }
    catch (e) { bnote(e.message, 'err'); }
  };
}

function heldTag(t) {
  if (!t.case_id) return {held: ['held', tr('tagPaused')], cancelled: ['', tr('tagCancelled')],
                          pending: ['warn', tr('tagPending', {t: hm(t.release_at)})]}[t.status] || null;
  return ({
    open: ['held', tr('tagOpen')],
    asked: ['held', tr('tagGuardianWait')],
    under_review: ['held', tr('tagReview')],
    returned: ['', tr('tagReturnedCase')],
    cancelled: ['held', tr('tagCancelledBank')],
    released: ['', tr('tagReleased')],
    withdrawn: ['', tr('tagWithdrawn')],
    guardian_cancelled: ['', tr('tagGuardianCancelled')],
  })[t.case_status === 'open' && t.guardian_state === 'asked' ? 'asked' : t.case_status] || (t.status === 'cancelled' ? ['', tr('tagCancelled')] : null);
}

    if (t.cash && t.face) tag = ['', tr('tagFace')];
    const open = !incoming && t.case_status === 'open' ? ` <button class="link" data-case="${t.case_id}">${tr('decide')}</button>` : '';
    const answer = !incoming && t.decision_comment ? `<div class="muted">${tr('bankAnswer')} ${esc(t.decision_comment)}</div>` : '';
    const report = !incoming && t.can_complain && !t.complained
      ? `<div><button class="link" data-report="${t.id}" style="padding:0;font-weight:500;color:var(--muted)">${tr('reportQ')}</button></div>` : '';
    const ico = t.cash ? CASH_ICON : t.loan ? '₸' : esc(initials(incoming ? t.sender : t.receiver));
    return `<div class="row"><span class="ico ${incoming ? 'in' : ''}" aria-hidden="true">${ico}</span>
            <div class="body">${esc(title)}${open}
            <div class="muted">${esc(when(t.created_at))}</div>${tag ? `<span class="tag ${tag[0]}">${esc(tag[1])}</span>` : ''}${answer}${report}</div>
            <div class="amt ${incoming ? 'in' : ''}">${incoming ? '+' : '−'}${money(t.amount)}</div></div>`;
  }).join('') || `<div class="muted">${tr('noOps')}</div>`;
  $('feed').querySelectorAll('button[data-case]').forEach(b => b.onclick = async () => showStop(await api('/cases/' + b.dataset.case)));
  openFirstAcc();
  compactAlerts();
  $('feed').querySelectorAll('button[data-report]').forEach(b => b.onclick = () => askReport(b));
}

// Главная: самое важное предупреждение (они идут по важности: звонок, отложенные операции, кредит, …) показано
// целиком, остальные свёрнуты до заголовка. Раскрытые клиентом остаются раскрытыми при обновлении экрана.
const openAlerts = new Set();
function compactAlerts() {
  [...document.querySelectorAll('[data-pane="home"] .alert')].forEach((a, i) => {
    const h = a.querySelector(':scope > h2');
    if (!h) return;
    // Ключ — заголовок и первая строка: у двух «Возможно, это чужие деньги» заголовки одинаковые, суммы разные.
    const key = h.textContent + '|' + ((a.querySelector(':scope > p') || {}).textContent || ''), compact = i > 0;
    a.classList.toggle('compact', compact);
    a.classList.toggle('open', compact && openAlerts.has(key));
    if (compact) {
      h.setAttribute('role', 'button'); h.tabIndex = 0;
      h.setAttribute('aria-expanded', String(a.classList.contains('open')));
      h.onclick = () => {
        const on = a.classList.toggle('open');
        h.setAttribute('aria-expanded', String(on));
        openAlerts[on ? 'add' : 'delete'](key);
      };
      h.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h.onclick(); } };
    } else {
      h.removeAttribute('role'); h.removeAttribute('tabindex'); h.removeAttribute('aria-expanded');
      h.onclick = h.onkeydown = null;
    }
  });
}

// Проверка QR-кода перед оплатой. В демо наклейки — готовые строки QR: настоящий магазин, подменённая парковка,
// кофейня со счётом в другом банке. Оплата — обычный перевод со всеми проверками.
const QR = {parking: [1003, 500], shop: [1015, 18500], cafe: [1016, 1800]};
async function checkQr(key) {
  const [acc, amount] = QR[key];
  const payload = `bccpay://pay?acc=${acc}&name=${encodeURIComponent(tr('qrName_' + key))}&amount=${amount}`;
  $('qrResult').innerHTML = '';
  try {
    const r = await api('/qr/check', {payload});
    let html = `<div class="msgres ${{ok: 'none', caution: 'caution', danger: 'danger'}[r.verdict]}"><h3>${esc(r.title)}</h3>
      <p><b>${tr('qrWho')}</b> ${esc(r.receiver)}</p><p>${esc(r.text)}</p>`;
    if (r.amount) html += `<p>${esc(tr('qrSum', {m: money(r.amount)}))}</p>`;
    if (r.receiver_id && r.amount) html += `<button class="${r.verdict === 'ok' ? 'primary' : 'soft'}" id="qrPay">${esc(tr('qrPay', {m: money(r.amount)}))}</button>`;
    $('qrResult').innerHTML = html + '</div>';
    if ($('qrPay')) $('qrPay').onclick = async () => {
      const x = await pay(r.receiver_id, r.amount, $('qrPay'));
      if (x && x.status !== 'held') $('qrResult').innerHTML = '';
    };
  } catch (e) { $('qrResult').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
document.querySelectorAll('[data-qr]').forEach(b => b.onclick = () => checkQr(b.dataset.qr));

    html += `<div class="msgres ${lv}" style="margin-top:0"><h3>${esc(tr('trResult', {s: of(s.result.score, s.result.total)}))}</h3><p>${esc(s.result.text)}</p></div>

      `<button class="primary" id="trStart">${tr(s.last ? 'trAgain' : 'trStart')}</button>`;

    html += `<div class="muted">${esc(tr('trStep', {i: s.i + 1, n: s.qs.length, k: q.kind}))}</div><p><b>${esc(q.text)}</b></p>` +
      q.options.map(o => `<button class="${a ? (o.id === a.right ? 'primary' : o.id === s.answers[q.id] ? 'soft' : 'ghost') : 'soft'}" data-tr="${o.id}" style="margin-top:8px;text-align:left">${esc(o.text)}</button>`).join('');
    if (a) html += `<div class="note ${a.correct ? 'ok' : 'err'}">${esc(a.correct ? tr('trRight') : tr('trWrong', {r: q.options.find(o => o.id === a.right).text}))} ${esc(a.explain)}</div>
      <button class="primary" id="trNext">${tr(s.i + 1 < s.qs.length ? 'trNext' : 'trFinish')}</button>`;
  }
  box.innerHTML = html;
  const top = () => box.scrollIntoView({behavior: 'smooth', block: 'start'});
  if ($('trStart')) $('trStart').onclick = () => { Object.assign(s, {i: 0, answers: {}, shown: null, result: null}); renderTrainer(); top(); };
  if (!s.shown) box.querySelectorAll('[data-tr]').forEach(b => b.onclick = async () => {
    const q = s.qs[s.i];
    try { s.shown = await api('/trainer/answer', {qid: q.id, choice: b.dataset.tr}); s.answers[q.id] = b.dataset.tr; renderTrainer(); }
    catch (e) { note(e.message, 'err'); }
  });
  if ($('trNext')) $('trNext').onclick = async () => {
    if (s.i + 1 < s.qs.length) { s.i++; s.shown = null; renderTrainer(); top(); return; }
    try {
      s.result = await api('/trainer/finish', {answers: s.answers});
      s.last = {score: s.result.score, total: s.result.total, at: serverNow};
      renderTrainer(); top();
    } catch (e) { note(e.message, 'err'); }
  };
}

// Свежий кредит: напоминаем, что банк не просит брать кредит ради «отмены заявки», и даём вернуть его.
async function repayLoan(id) {

function renderLoan(loan) {

// «Сейф»: сбережения, которые нельзя перевести через приложение. Открыть — в отделении или через сутки.
let safeKey = '';
function renderSafe(safe, status) {
  const key = JSON.stringify([me, L, safe, status]);
  if (key === safeKey) return;                 // поле суммы не сбрасывается, пока клиент его заполняет
  safeKey = key;
  const box = $('safeCard');
  if (!safe || status === 'blocked') { box.hidden = true; return; }
  box.hidden = false;
  let html = `<h2>${tr('safeH')}</h2><div class="brief">${brief(tr('safeAbout'), {cls: 'muted'})}</div>
    <p><b>${esc(tr('safeNow', {m: money(safe.amount)}))}</b></p>`;
  if (safe.unlock_at)
    html += `<div class="note err">${esc(tr('safeWait', {m: money(safe.unlock_amount), t: when(safe.unlock_at)}))}</div>
      <button class="primary" id="safeKeep">${tr('safeKeep')}</button>`;
  html += `<label for="safeAmount">${tr('amount')}</label><input id="safeAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="0">
    <button class="primary" id="safeLock">${tr('safeLock')}</button>`;
  if (safe.amount && !safe.unlock_at)
    html += `<button class="soft" id="safeDelay" style="margin-top:8px">${tr('safeDelay')}</button>
      <button class="ghost" id="safeBranch">${tr('safeBranch')}</button>`;
  html += '<div id="safeNote"></div>';
  box.innerHTML = html;
  const act = (id, path, body) => { if ($(id)) $(id).onclick = async () => {
    const amount = Math.floor(+$('safeAmount').value || 0);
    try { await api(path, body ? body(amount) : {}); $('safeNote').innerHTML = ''; safeKey = ''; await load(); }
    catch (e) { $('safeNote').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
  }; };
  act('safeLock', '/safe/lock', amount => ({amount}));
  act('safeDelay', '/safe/unlock', amount => ({amount: amount || safe.amount, way: 'delay'}));
  act('safeBranch', '/safe/unlock', amount => ({amount: amount || safe.amount, way: 'branch'}));
  act('safeKeep', '/safe/keep');
}

// Доверенное лицо: близкий человек попросил открыть сейф.

// Проверка подозрительного сообщения: схема, что насторожило и что делать.
$('msgCheck').onclick = async () => {
  $('msgCheck').disabled = true;
  try {
    const r = await api('/messages/check', {text: $('msgText').value});
    let html = `<div class="msgres ${r.verdict}"><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p>`;
    if (r.matched.length) html += `<p>${tr('msgHits')} ${r.matched.map(m => `<span class="hit">${esc(m)}</span>`).join(' ')}</p>`;
    if (r.flags.length) html += `<ul>${r.flags.map(f => `<li>${esc(f.text)}</li>`).join('')}</ul>`;
    if (r.advice.length) html += `<b>${tr('msgDo')}</b><ol>${r.advice.map(a => `<li>${esc(a)}</li>`).join('')}</ol>`;
    if (r.verdict === 'danger') html += `<p style="font-size:14px">${tr('msgWatch')}</p>`;
    if (r.return_incoming) html += `<button class="primary" id="msgReturn">${esc(tr('msgReturn', {m: money(r.return_incoming.amount), who: r.return_incoming.sender}))}</button>`;
    $('msgResult').innerHTML = html + '</div>';
    if (r.return_incoming) $('msgReturn').onclick = async () => {
      $('msgReturn').disabled = true;
      try { const x = await api(`/incoming/${r.return_incoming.id}/return`, {}); note(tr('returnedOk', {m: money(x.amount)}), 'ok'); $('msgResult').innerHTML = ''; }
      catch (e) { note(e.message, 'err'); }
      load();
    };
  } catch (e) { $('msgResult').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
  $('msgCheck').disabled = false;
};
document.querySelectorAll('[data-example]').forEach(b => b.onclick = () => {

});

function askReport(btn) {
  const box = document.createElement('div');
  box.className = 'confirm';
  box.innerHTML = `${tr('reportConfirm')}<br>
    <button class="primary">${tr('yesReport')}</button><button class="soft">${tr('cancel')}</button>`;
  btn.replaceWith(box);
  const [yes, no] = box.querySelectorAll('button');
  no.onclick = () => load();
  yes.onclick = async () => {
    yes.disabled = true;
    try { const r = await api(`/transfers/${btn.dataset.report}/complaint`, {}); note(r.text, r.outcome === 'warned' ? 'err' : 'ok'); }
    catch (e) { note(e.message, 'err'); }
    load();
  };
}

function showStop(r) {
  held = r;
  // Текст окна зависит от причины: чужие деньги, звонок мошенника или подозрительный получатель.
  $('stopText').textContent = tr({scheme: 'stopText', call: 'stopTextCall', grey: 'stopTextGrey', message: 'stopTextMessage', loan: 'stopTextLoan', rental: 'stopTextRental', dictation: 'stopTextDictation', casino: 'stopTextCasino'}[r.kind] || 'stopText');
  $('reasons').innerHTML = r.reasons.map(x => `<li>${esc(x.text)}</li>`).join('');
  $('law').hidden = !['scheme', 'rental', 'casino'].includes(r.kind);
  $('repayLoan').hidden = !r.loan;
  if (r.loan) $('repayLoan').textContent = tr('loanRepay', {m: money(r.loan.amount)});
  $('ret').hidden = !r.safe_return;
  $('withdraw').hidden = !!r.safe_return;
  if (r.safe_return) $('ret').textContent = tr('ret', {m: money(r.safe_return.amount)});
  $('stopGuardian').textContent = r.guardian ? tr('stopGuardian', {g: r.guardian}) : '';
  $('overlay').classList.add('show');
}

$('withdraw').onclick = async () => {
  $('overlay').classList.remove('show');
  try { await api(`/cases/${held.case_id}/withdraw`, {}); note(tr('withdrawOk'), 'ok'); $('amount').value = ''; }
  catch (e) { note(e.message, 'err'); }
  load();
};

// Проверка получателя по базе Антифрод-центра ещё до нажатия «Перевести».
async function checkRecipient() {
  const id = $('to').value;
  if (!id) return;
  const r = await api(`/recipients/${id}/check`).catch(() => null);
  if ($('to').value !== id) return;
  const lv = r && r.risk && r.risk.level;
  $('recipientNote').innerHTML = lv ? `<div class="risk ${lv}" id="riskLight"><i></i><span><b>${tr({red: 'riskRed', yellow: 'riskYellow', green: 'riskGreen'}[lv])}</b>${esc(r.risk.text)}</span></div>` : '';
}
$('to').onchange = checkRecipient;

let callOn = false;
function renderCall(call) {
  callOn = !!call;
  $('callAlert').innerHTML = call ? `<div class="alert call"><h2>${tr('callH')}</h2>${brief(tr('callText', {n: call.number}), {keepLast: true})}</div>` : '';
  $('callToggle').textContent = tr(callOn ? 'demoCallOff' : 'demoCallOn');
  compactAlerts();
}
$('callToggle').onclick = async () => {
  const r = await api('/telecom/signal', {active: !callOn}).catch(e => { note(e.message, 'err'); return undefined; });
  if (r !== undefined) renderCall(r);
};

async function pay(receiver_id, amount, btn) {
  note(''); btn.disabled = true;
  let r = null;
  try {
    // Отметки приложения о ходе перевода («перевод под диктовку»). В демо их ставят переключатели слева.
    const session = Object.fromEntries([...document.querySelectorAll('[data-sess]')].map(b => [b.dataset.sess, b.checked]));
    const body = {receiver_id, amount};
    if (Object.values(session).some(Boolean)) body.session = session;
    r = await api('/transfers', body);
    if (r.status === 'held') showStop(r);
    else if (r.status === 'pending') note(tr('coolSent', {t: hm(r.release_at)}), 'err');
    else note(tr('done'), 'ok');
  } catch (e) { note(e.message, 'err'); }
  btn.disabled = false; load();
  return r;
}
$('send').onclick = async () => {
  const r = await pay(+$('to').value, Math.floor(+$('amount').value), $('send'));
  if (r && r.status !== 'held') $('amount').value = '';
};
$('ret').onclick = async () => {

  load();
};
$('insist').onclick = async () => {

  load();
};
$('repayLoan').onclick = () => { $('overlay').classList.remove('show'); repayLoan(held.loan.id); };
$('later').onclick = () => { $('overlay').classList.remove('show'); load(); };
// При смене клиента сразу убираем экран прежнего: иначе можно успеть нажать кнопку в чужом случае.
function clearScreen() {
  openAlerts.clear();
  note(''); appeal = null; held = null;
  $('overlay').classList.remove('show');

// Язык хранится в cookie: сервер читает его и отвечает на том же языке.
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = async () => {
  L = b.dataset.lang;
  document.cookie = `ca_lang=${L}; path=/; max-age=31536000; samesite=strict`;

(async () => {
  applyStatic();
  await loadPeople();
  const s = await api('/me').catch(() => null);
  await loginAs(s && s.client ? s.client.client_id : people[0].id);

})();
